AWSTemplateFormatVersion: "2010-09-09"
Description: "Spry Monorepo — AI Agenda Parser Infrastructure with Amazon Bedrock (Lab 6)"

Parameters:
  ProjectName:
    Type: String
    Default: spry
    Description: Project name prefix for resource naming and tagging
  Environment:
    Type: String
    Default: production
    Description: Environment name
  ParserImageUri:
    Type: String
    Description: ECR Image URI containing the FastAPI/AI application bundle
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_7FvYNO3Qp
    Description: Cognito User Pool ID for JWT authentication
  CognitoClientId:
    Type: String
    Default: 3f1rgrm4hrmsuhhbmfjjle9t28
    Description: Cognito App Client ID for JWT audience validation
  ParserModel:
    Type: String
    Default: mistral.ministral-3-14b-instruct
    Description: Bedrock foundation model ID for agenda parsing
  NotificationEmail:
    Type: String
    Default: oksentiuk.pn@ucu.edu.ua
    Description: Recipient email address for monthly AWS Budgets alert

Resources:
  # ----------------------------------------------------------------------------
  # 1. IAM Execution Role for Agenda Parser (outside VPC)
  # ----------------------------------------------------------------------------
  AgendaParserExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInferenceAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Converse
                  - bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-agenda-parser-role"
        - Key: Project
          Value: !Ref ProjectName

  # ----------------------------------------------------------------------------
  # 2. AWS Lambda Function: agenda-parser (Runs outside VPC, $0 idle cost)
  # ----------------------------------------------------------------------------
  AgendaParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Role: !GetAtt AgendaParserExecutionRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref ParserImageUri
      ImageConfig:
        Command:
          - "app.ai.agenda_lambda.handler"
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          PARSER_REGION: !Ref "AWS::Region"
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-agenda-parser"
        - Key: Project
          Value: !Ref ProjectName

  # ----------------------------------------------------------------------------
  # 3. AWS Lambda Function URL with CORS
  # ----------------------------------------------------------------------------
  AgendaParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgendaParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - "https://1233.pp.ua"
          - "https://www.1233.pp.ua"
          - "http://localhost:5173"
          - "http://127.0.0.1:5173"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 86400

  AgendaParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AgendaParserFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ----------------------------------------------------------------------------
  # 4. AWS Budgets Alarm ($5/month limit with notification)
  # ----------------------------------------------------------------------------
  MonthlyAiBudgetAlarm:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly-ai-budget"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5.0
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80.0
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100.0
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  AgendaParserFunctionName:
    Description: Name of the agenda parser Lambda function
    Value: !Ref AgendaParserFunction
  AgendaParserFunctionUrl:
    Description: Public HTTPS Function URL for the agenda parser
    Value: !GetAtt AgendaParserFunctionUrl.FunctionUrl
