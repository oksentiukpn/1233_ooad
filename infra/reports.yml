AWSTemplateFormatVersion: "2010-09-09"
Description: "Spry Monorepo — Event-Driven Weekly Reporting Architecture (Lab 5)"

Parameters:
  ProjectName:
    Type: String
    Default: spry
    Description: Project name prefix for naming and tagging
  Environment:
    Type: String
    Default: production
    Description: Environment name
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Aurora and Lambda report-builder reside
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for Lambda report-builder
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security Group IDs for Lambda report-builder
  RouteTableIds:
    Type: List<String>
    Description: Route table IDs to attach Gateway S3 VPC endpoint
  BuilderImageUri:
    Type: String
    Description: ECR Image URI for report-builder Lambda
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Aurora PostgreSQL connection string
  ReportSenderEmail:
    Type: String
    Default: reports@1233.pp.ua
    Description: Verified SES sender email address
  ReportRecipientEmail:
    Type: String
    Default: oksentiuk.pn@ucu.edu.ua
    Description: Verified SES recipient email address

Resources:
  # ----------------------------------------------------------------------------
  # 1. S3 Reports Bucket & Gateway VPC Endpoint (Step 2)
  # ----------------------------------------------------------------------------
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerLambdaPermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfter90Days
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt ReportMailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-reports"
        - Key: Project
          Value: !Ref ProjectName

  S3GatewayVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  # ----------------------------------------------------------------------------
  # 2. SQS Queues: Request Queue & DLQ (Step 4)
  # ----------------------------------------------------------------------------
  ReportRequestsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-report-requests-dlq"
        - Key: Project
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 360 # 6x builder 60s timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-report-requests"
        - Key: Project
          Value: !Ref ProjectName

  # ----------------------------------------------------------------------------
  # 3. Lambda report-builder (in VPC, Aurora access) (Step 3 & 4)
  # ----------------------------------------------------------------------------
  ReportBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-builder-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: BuilderS3AndSQSPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ReportBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Role: !GetAtt ReportBuilderRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref BuilderImageUri
      ImageConfig:
        Command:
          - app.reports.lambda_handler.handler
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          AWS_REGION: !Ref AWS::Region
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-report-builder"
        - Key: Project
          Value: !Ref ProjectName

  ReportRequestsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !GetAtt ReportBuilderFunction.Arn

  # ----------------------------------------------------------------------------
  # 4. Lambda report-mailer (outside VPC, SES access) (Step 5 & 6)
  # ----------------------------------------------------------------------------
  ReportMailerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-mailer-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerS3AndSESPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - sesv2:SendEmail
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ReportMailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Role: !GetAtt ReportMailerRole.Arn
      Runtime: python3.12
      Handler: mailer_handler.handler
      Timeout: 30
      MemorySize: 256
      Code:
        ZipFile: |
          from email.message import EmailMessage
          import logging, os, re, urllib.parse, boto3

          logger = logging.getLogger("report-mailer")
          logger.setLevel(logging.INFO)

          def extract_week(key):
              m = re.search(r"reports/(\d{4}-W\d{2})\.csv", key)
              return m.group(1) if m else os.path.splitext(os.path.basename(key))[0]

          def handler(event, context):
              if not event.get("Records"):
                  return {"status": "ignored"}
              rec = event["Records"][0]["s3"]
              bucket = rec["bucket"]["name"]
              key = urllib.parse.unquote_plus(rec["object"]["key"])
              week = extract_week(key)

              logger.info(f"report-mailer triggered: trigger=s3, bucket={bucket}, key={key}, week={week}",
                          extra={"trigger": "s3", "bucket": bucket, "key": key, "week": week})

              s3 = boto3.client("s3")
              csv_bytes = s3.get_object(Bucket=bucket, Key=key)["Body"].read()

              sender = os.environ.get("REPORT_SENDER_EMAIL", "reports@1233.pp.ua")
              recipients = [r.strip() for r in os.environ.get("REPORT_RECIPIENT_EMAIL", "").split(",") if r.strip()]

              msg = EmailMessage()
              msg["Subject"] = f"Weekly Meetings Report: {week} (Spry Monorepo)"
              msg["From"] = sender
              msg["To"] = ", ".join(recipients)
              msg.set_content(f"Вітаємо!\n\nЩотижневий звіт засідань за {week} сформовано.\nCSV файл додано у вкладенні.\n\n--\nSpry Reporting Service")
              msg.add_attachment(csv_bytes, maintype="text", subtype="csv", filename=f"report-{week}.csv")

              ses = boto3.client("sesv2", region_name=os.environ.get("AWS_REGION", "us-east-1"))
              res = ses.send_email(
                  FromEmailAddress=sender,
                  Destination={"ToAddresses": recipients},
                  Content={"Raw": {"Data": msg.as_bytes()}}
              )
              logger.info(f"Email sent via SES: {res.get('MessageId')}")
              return {"status": "success", "message_id": res.get("MessageId")}
      Environment:
        Variables:
          REPORT_SENDER_EMAIL: !Ref ReportSenderEmail
          REPORT_RECIPIENT_EMAIL: !Ref ReportRecipientEmail
          AWS_REGION: !Ref AWS::Region
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-report-mailer"
        - Key: Project
          Value: !Ref ProjectName

  MailerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ReportMailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # ----------------------------------------------------------------------------
  # 5. EventBridge Scheduler (cron Mondays 07:00 Kyiv) -> SQS (Step 3 & 4)
  # ----------------------------------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-report-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendMessageToSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report-schedule"
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

Outputs:
  ReportsBucketName:
    Description: Name of S3 bucket for weekly reports
    Value: !Ref ReportsBucket
  ReportRequestsQueueUrl:
    Description: URL of SQS queue for report requests
    Value: !Ref ReportRequestsQueue
  ReportRequestsQueueArn:
    Description: ARN of SQS queue for report requests
    Value: !Ref ReportRequestsQueue.Arn
  ReportBuilderFunctionName:
    Description: Name of report builder Lambda
    Value: !Ref ReportBuilderFunction
  ReportMailerFunctionName:
    Description: Name of report mailer Lambda
    Value: !Ref ReportMailerFunction
