AWSTemplateFormatVersion: '2010-09-09'
Description: 'Amazon Cognito User Pool with Hosted UI and Google Identity Provider (Lab 4)'

Parameters:
  ProjectName:
    Type: String
    Default: spry
    Description: Project name prefix for resource naming and tagging
  CognitoDomainPrefix:
    Type: String
    Default: spry-1233
    Description: Prefix for Cognito Hosted UI domain
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth Client Secret (NoEcho for security)
  SiteUrl:
    Type: String
    Default: 'https://1233.pp.ua'
    Description: Production frontend URL

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      PasswordPolicy:
        MinimumLength: 8
        RequireLowercase: true
        RequireNumbers: true
        RequireSymbols: false
        RequireUppercase: true
      UserPoolTier: ESSENTIALS
      UserPoolTags:
        Project: !Ref ProjectName

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'openid email profile'
      AttributeMapping:
        email: email
        email_verified: email_verified

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub '${ProjectName}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs:
        - !Sub '${SiteUrl}/auth/callback/'
        - !Sub '${SiteUrl}/auth/callback'
        - !Sub '${SiteUrl}/'
        - 'http://localhost:5173/auth/callback/'
        - 'http://localhost:5173/auth/callback'
        - 'http://localhost:5173/'
      LogoutURLs:
        - !Sub '${SiteUrl}/'
        - !Sub '${SiteUrl}/login/'
        - 'http://localhost:5173/'
        - 'http://localhost:5173/login/'

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn:
      - UserPoolClient
      - UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Cognito Hosted UI Domain
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  CognitoLoginUrl:
    Description: Direct URL to the Cognito Hosted UI Login Page
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=${SiteUrl}/auth/callback/'
