name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend Quality Gate (Lint, Format, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Check formatting with Ruff
        working-directory: backend
        run: ruff format --check .

      - name: Run unit & integration tests with Pytest
        working-directory: backend
        run: pytest tests/

  frontend-lint-and-typecheck:
    name: Frontend Quality Gate (Lint, Format, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting with Prettier
        working-directory: frontend
        run: npm run format:check

      - name: TypeScript typecheck & Build
        working-directory: frontend
        run: npm run build

  deploy-backend:
    name: Step 8 — Backend CD to AWS Lambda via OIDC
    needs: [backend-lint-and-test, frontend-lint-and-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Step 8: Required for requesting the GitHub OIDC JWT token
      contents: read # Required for actions/checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 8: Assume IAM Role using ephemeral GitHub OIDC WebIdentity token
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791614297907:role/spry-github-actions-role' }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag with commit SHA, and push Lambda image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spry-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Lambda container image tagged with commit SHA: $IMAGE_TAG"
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f backend/Dockerfile.lambda backend

          echo "Pushing Lambda image to ECR ($ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG)..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to AWS Lambda & Run Programmatic Database Migrations
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spry-backend
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: us-east-1
          FUNCTION_NAME: spry-backend
        run: |
          echo "--> Updating AWS Lambda function code to $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG..."
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --region "$AWS_REGION"

          echo "--> Waiting for Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

          echo "--> Invoking database migrations directly in Lambda (action: migrate)..."
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload '{"action": "migrate"}' \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            migration-response.json

          echo "--> Migration output:"
          cat migration-response.json
