name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend Quality Gate (Lint, Format, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Check formatting with Ruff
        working-directory: backend
        run: ruff format --check .

      - name: Run unit & integration tests with Pytest
        working-directory: backend
        run: pytest tests/

  frontend-lint-and-typecheck:
    name: Frontend Quality Gate (Lint, Format, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting with Prettier
        working-directory: frontend
        run: npm run format:check

      - name: TypeScript typecheck & Build
        working-directory: frontend
        run: npm run build

  deploy-backend:
    name: Step 8 — Backend CD via AWS OIDC (No Static Keys)
    needs: [backend-lint-and-test, frontend-lint-and-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Step 8: Required for requesting the GitHub OIDC JWT token
      contents: read # Required for actions/checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 8: Assume IAM Role using ephemeral GitHub OIDC WebIdentity token
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::791614297907:role/spry-github-actions-role' }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag with commit SHA, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spry-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building container image tagged with commit SHA: $IMAGE_TAG"
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f backend/Dockerfile backend

          echo "Pushing image to ECR ($ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG)..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Roll AWS backend service (App Runner / ECS)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spry-backend
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: eu-central-1
        run: |
          # 1. Update AWS App Runner (Option 2 — architecture.md)
          APP_RUNNER_ARN=$(aws apprunner list-services --region "$AWS_REGION" --query "ServiceSummaryList[?ServiceName=='spry-backend'].ServiceArn" --output text 2>/dev/null || true)
          if [ -n "$APP_RUNNER_ARN" ]; then
            echo "--> Updating AWS App Runner service ($APP_RUNNER_ARN) to tag: $IMAGE_TAG"
            SRC_CFG=$(aws apprunner describe-service --service-arn "$APP_RUNNER_ARN" --region "$AWS_REGION" --query "Service.SourceConfiguration" --output json)
            UPDATED_CFG=$(echo "$SRC_CFG" | jq -c --arg img "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" '.ImageRepository.ImageIdentifier = $img')
            aws apprunner update-service \
              --service-arn "$APP_RUNNER_ARN" \
              --source-configuration "$UPDATED_CFG" \
              --region "$AWS_REGION" || aws apprunner start-deployment --service-arn "$APP_RUNNER_ARN" --region "$AWS_REGION" || true
            echo "--> AWS App Runner updated successfully to tag: $IMAGE_TAG"
          fi

          # 2. Update AWS ECS Service (if ECS cluster is active)
          ECS_SERVICE_EXISTS=$(aws ecs describe-services --cluster spry-cluster --services spry-backend-service --region "$AWS_REGION" --query "services[?status=='ACTIVE'].serviceName" --output text 2>/dev/null || true)
          if [ -n "$ECS_SERVICE_EXISTS" ]; then
            echo "--> Rolling AWS ECS service 'spry-backend-service' on cluster 'spry-cluster' to tag: $IMAGE_TAG"
            aws ecs update-service \
              --cluster spry-cluster \
              --service spry-backend-service \
              --force-new-deployment \
              --region "$AWS_REGION"
            echo "--> AWS ECS service rolling update triggered successfully."
          fi
