name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Quality Gate (Ruff & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest httpx

      - name: Run Ruff Lint
        run: ruff check backend/

      - name: Run Ruff Format Check
        run: ruff format --check backend/

      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENVIRONMENT: "test"
          SECRET_KEY: "test-secret-key-for-jwt-signing"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        run: pytest backend/tests

  frontend-lint-and-typecheck:
    name: Frontend Quality Gate (Lint, Format, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck & production build
        run: npm run build

  deploy-backend:
    name: Step 8 — Backend CD to AWS Lambda & Azure GHCR
    needs: [backend-lint-and-test, frontend-lint-and-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Step 8: Required for requesting the GitHub OIDC JWT token
      contents: read # Required for actions/checkout
      packages: write # For publishing OCI image to GHCR for Azure Container Apps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::04b077958ddb:role/spry-github-actions-deploy-role
          role-session-name: GitHubActionsDeploymentSession
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push container image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spry-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building container image for AWS Lambda with target platform linux/amd64..."
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f backend/Dockerfile.lambda backend \
            --push

      - name: Build and push standard container image to GHCR for Azure
        run: |
          echo "Building standard container image for Azure Container Apps..."
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t ghcr.io/${OWNER}/spry-backend:latest \
            -t ghcr.io/${OWNER}/spry-backend:${{ github.sha }} \
            -f backend/Dockerfile backend \
            --push

      - name: Deploy to AWS Lambda & Run Programmatic Database Migrations
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: spry-backend
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: us-east-1
          FUNCTION_NAME: spry-backend
        run: |
          echo "--> Updating AWS Lambda function code to $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG..."
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --region "$AWS_REGION"

          echo "--> Waiting for AWS Lambda function update to complete..."
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

          echo "--> Invoking Lambda runner to execute Alembic database migrations..."
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload '{"task": "migrate"}' \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            migration_response.json

          cat migration_response.json
          echo ""
          echo "=== CI/CD Backend Deployment & DB Migrations Complete ==="
